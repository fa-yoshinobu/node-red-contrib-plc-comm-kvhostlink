<script type="text/javascript">
  const KVHOSTLINK_WRITE_ADDRESS_TOKEN_RE = /^[A-Z][A-Z0-9]*[0-9A-F]+(?:\.[0-9A-F]|:[A-Z]+)(?:,\d+)?$/i;
  const KVHOSTLINK_WRITE_DEVICE_BASES = Object.freeze({
    R: 10, B: 16, MR: 10, LR: 10, CR: 10, VB: 16,
    DM: 10, EM: 10, FM: 10, ZF: 10, W: 16, TM: 10, Z: 10,
    T: 10, TC: 10, TS: 10, C: 10, CC: 10, CS: 10, CTH: 10, CTC: 10, AT: 10,
    CM: 10, VM: 10, X: 10, Y: 10, M: 10, L: 10, D: 10, E: 10, F: 10
  });
  const KVHOSTLINK_WRITE_DEVICE_CODES = Object.keys(KVHOSTLINK_WRITE_DEVICE_BASES).sort(function (left, right) {
    return right.length - left.length || left.localeCompare(right);
  });
  const KVHOSTLINK_WRITE_DTYPE_SUFFIXES = new Set(["U", "S", "D", "L", "F", "H", "BIT"]);
  const KVHOSTLINK_WRITE_BIT_BANK_DEVICE_TYPES = new Set(["R", "MR", "LR", "CR"]);
  const KVHOSTLINK_WRITE_XY_DEVICE_TYPES = new Set(["X", "Y"]);
  const KVHOSTLINK_WRITE_DIRECT_BIT_DEVICE_TYPES = new Set(["R", "B", "MR", "LR", "CR", "VB", "X", "Y", "M", "L"]);
  const KVHOSTLINK_WRITE_FLOAT_DEVICE_TYPES = new Set(["DM", "EM", "FM", "ZF", "W", "TM", "CM", "VM", "D", "E", "F"]);

  function kvGetWriteCurrentType(typeSelector, savedType, node) {
    const activeNode = RED.editor && RED.editor.activeNode;
    const isActiveNode = Boolean(node && activeNode && (node === activeNode || (node.id && activeNode.id === node.id)));
    if (isActiveNode) {
      const field = $(typeSelector);
      if (field.length > 0 && field.val()) {
        return field.val();
      }
    }
    return savedType;
  }

  function kvValidateWriteReferencePath(value) {
    return Boolean(String(value == null ? "" : value).trim());
  }

  function kvValidateWriteAddress(address) {
    const token = String(address || "").trim();
    return KVHOSTLINK_WRITE_ADDRESS_TOKEN_RE.test(token) && kvValidateWriteAddressToken(token);
  }

  function kvValidateWriteAddressToken(value) {
    const text = String(value == null ? "" : value).trim().toUpperCase();
    if (!text) {
      return false;
    }

    const match = /^([A-Z][A-Z0-9]*[0-9A-F]+)(?::([A-Z]+)|\.([0-9A-F]))(?:,([0-9]+))?$/.exec(text);
    if (!match || !kvValidateWriteDeviceToken(match[1])) {
      return false;
    }
    const count = match[4] === undefined ? 1 : Number(match[4]);
    if (!Number.isSafeInteger(count) || count <= 0) {
      return false;
    }
    const deviceType = KVHOSTLINK_WRITE_DEVICE_CODES.find(function (code) { return match[1].startsWith(code); });
    if (deviceType === "AT") {
      return false;
    }
    if (match[2]) {
      return KVHOSTLINK_WRITE_DTYPE_SUFFIXES.has(match[2])
        && !(match[2] === "BIT" && !KVHOSTLINK_WRITE_DIRECT_BIT_DEVICE_TYPES.has(deviceType))
        && !(match[2] === "F" && !KVHOSTLINK_WRITE_FLOAT_DEVICE_TYPES.has(deviceType));
    }
    return match[3] !== undefined && match[4] === undefined;
  }

  function kvValidateWriteDeviceToken(text) {
    for (const code of KVHOSTLINK_WRITE_DEVICE_CODES) {
      if (!text.startsWith(code)) {
        continue;
      }
      const numberText = text.slice(code.length);
      if (!numberText) {
        return false;
      }
      if (KVHOSTLINK_WRITE_XY_DEVICE_TYPES.has(code)) {
        const bankText = numberText.length === 1 ? "0" : numberText.slice(0, -1);
        return /^[0-9]+$/.test(bankText) && /^[0-9A-F]$/i.test(numberText.slice(-1));
      }
      if (KVHOSTLINK_WRITE_DEVICE_BASES[code] === 16) {
        return /^[0-9A-F]+$/i.test(numberText);
      }
      if (!/^\d+$/.test(numberText)) {
        return false;
      }
      if (KVHOSTLINK_WRITE_BIT_BANK_DEVICE_TYPES.has(code)) {
        return Number.parseInt(numberText, 10) % 100 <= 15;
      }
      return true;
    }
    return false;
  }

  function kvValidateWriteLiteral(value) {
    const text = String(value == null ? "" : value).trim();
    if (!text) {
      return true;
    }
    try {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        return false;
      }
      return Object.keys(parsed).every(kvValidateWriteAddress);
    } catch (_error) {
      return false;
    }
  }

  function kvValidateWriteSourceField(value, typeSelector, literalValidator, savedType, node) {
    const type = kvGetWriteCurrentType(typeSelector, savedType, node);
    if (type === "str") {
      return literalValidator(value);
    }
    return ["msg", "flow", "global", "env"].includes(type) && kvValidateWriteReferencePath(value);
  }

  function setupKvWriteSourceField(sourceId, typeId, literalId, hiddenId) {
    const sourceField = $(sourceId);
    const typeField = $(typeId);
    const literalField = $(literalId);
    const literalRow = literalField.closest(".form-row");

    sourceField.typedInput({
      default: "str",
      typeField: typeField,
      types: ["msg", "flow", "global", "env", "str"]
    });

    const refresh = function () {
      const type = sourceField.typedInput("type");
      const isLiteral = type === "str";
      literalRow.toggle(isLiteral);
      if (isLiteral) {
        sourceField.typedInput("value", literalField.val());
      }
      $(hiddenId).val(isLiteral ? literalField.val() : sourceField.typedInput("value"));
    };

    sourceField.on("change", refresh);
    literalField.on("change keyup", refresh);
    refresh();
    return refresh;
  }

  RED.nodes.registerType("kvhostlink-write", {
    category: "KV Host Link",
    color: "#f29d7e",
    defaults: {
      name: { value: "" },
      connection: { value: "", type: "kvhostlink-connection", required: true },
      updates: {
        value: "",
        validate: function (value) {
          return kvValidateWriteSourceField(value, "#node-input-updatesType", kvValidateWriteLiteral, this && this.updatesType, this);
        }
      },
      updatesType: { value: "str", required: true },
      errorHandling: { value: "throw", required: true },
      metadataMode: { value: "full", required: true },
      outputs: { value: 1 }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-upload",
    label: function () {
      return this.name || "KV Host Link Write";
    },
    oneditprepare: function () {
      const sourceField = $("#node-input-updatesSource");
      const literalField = $("#node-input-updatesLiteral");
      literalField.val(this.updates || "");
      sourceField.val(this.updates || "");
      $("#node-input-updatesType").val(this.updatesType);
      const refreshUpdates = setupKvWriteSourceField(
        "#node-input-updatesSource",
        "#node-input-updatesType",
        "#node-input-updatesLiteral",
        "#node-input-updates"
      );
      refreshUpdates();
    },
    oneditsave: function () {
      const sourceField = $("#node-input-updatesSource");
      const type = sourceField.typedInput("type");
      $("#node-input-updatesType").val(type);
      $("#node-input-updates").val(type === "str" ? $("#node-input-updatesLiteral").val() : sourceField.typedInput("value"));
      this.outputs = $("#node-input-errorHandling").val() === "output2" ? 2 : 1;
    }
  });
</script>

<script type="text/html" data-template-name="kvhostlink-write">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" />
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-plug"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>
  <div class="form-row">
    <label for="node-input-updatesSource"><i class="fa fa-sign-in"></i> Source</label>
    <input type="hidden" id="node-input-updatesType" />
    <input type="text" id="node-input-updatesSource" style="width: 70%;" />
    <input type="hidden" id="node-input-updates" />
  </div>
  <div class="form-row" id="node-input-updatesLiteralRow">
    <label for="node-input-updatesLiteral"><i class="fa fa-pencil"></i> Static updates</label>
    <textarea id="node-input-updatesLiteral" style="height: 140px;" placeholder="{&quot;DM100:U&quot;:123,&quot;DM110:S&quot;:-5,&quot;DM150.3&quot;:true,&quot;R010:BIT&quot;:true}"></textarea>
  </div>
  <div class="form-row">
    <label for="node-input-metadataMode"><i class="fa fa-database"></i> Metadata</label>
    <select id="node-input-metadataMode">
      <option value="full">Full msg.kvhostlink</option>
      <option value="minimal">Minimal msg.kvhostlink</option>
      <option value="off">Do not modify msg.kvhostlink</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-errorHandling"><i class="fa fa-exclamation"></i> Errors</label>
    <select id="node-input-errorHandling">
      <option value="throw">Throw</option>
      <option value="msg">msg.error</option>
      <option value="output2">Second output</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="kvhostlink-write">
  <p>Writes one or more KEYENCE KV Host Link values using the high-level helper API.</p>
  <p><b>Name</b> is an optional display-only label. It is not a node ID, connection reference, route, request field, or metadata field, and duplicate labels are allowed.</p>
  <p>Preferred dynamic input is <code>msg.updates</code> as an object, for example <code>{ "DM100:U": 123, "DM110:S": -5, "DM150.3": true, "R010:BIT": true }</code>.</p>
  <p>A present runtime field is authoritative: invalid or empty <code>msg.updates</code>/<code>msg.address</code> is an error and never falls back to configured updates. <code>msg.updates</code> and <code>msg.address</code> are mutually exclusive; <code>msg.value</code>/<code>msg.dtype</code> cannot appear without <code>msg.address</code>.</p>
  <p>Count-qualified addresses expect arrays, for example <code>{ "DM160:U,4": [1,2,3,4], "R200:BIT,4": [true,false,true,true] }</code>.</p>
  <p>Each address must match one complete selector grammar. Extra selectors or trailing text fail. <code>BIT</code> is only for direct-bit device families. Float32 <code>F</code> is only for ordinary one-word <code>.U</code> families with consecutive two-word access; direct-bit and native 32-bit/special-response families such as <code>R</code>, <code>T</code>, <code>C</code>, <code>Z</code>, and <code>AT</code> fail before FIFO admission or transport.</p>
  <p>The complete update set is validated before the first request. A compiled group above 1000 word points, 500 dword/Float32 points, or 120 timer/counter points rejects the whole call and is not split automatically.</p>
  <p>Use <code>:</code> for typed data. <code>DM100.D</code> means bit <code>D</code> / bit 13 inside <code>DM100</code>; use <code>DM100:D</code> for an unsigned 32-bit value.</p>
  <p>The configured source can be literal text, <code>msg</code>, <code>flow</code>, <code>global</code>, or <code>env</code>. Literal text accepts JSON objects only.</p>
  <p>You can also send a single write with <code>msg.address</code> and <code>msg.value</code>. A bare address requires exactly one uppercase <code>msg.dtype</code>: <code>BIT</code>, <code>U</code>, <code>S</code>, <code>D</code>, <code>L</code>, <code>F</code>, or <code>H</code>. Omit <code>msg.dtype</code> when the address already contains a dtype or word-bit selector; specifying both is an error. If <code>msg.address</code> already includes <code>,count</code>, the dtype is inserted before the count suffix. <code>COMMENT</code> is read-only.</p>
  <p>Send <code>msg.connect</code>, <code>msg.disconnect</code>, or <code>msg.reinitialize</code> as <code>true</code>, or send the same words in <code>msg.topic</code>, to control the shared connection.</p>
  <p>The node keeps the caller-visible logical write shape. It does not silently retry one logical update as a different fallback split request.</p>
</script>
