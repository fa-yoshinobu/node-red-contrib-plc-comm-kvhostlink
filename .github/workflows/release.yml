name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Check GitHub source archive contents
        shell: pwsh
        run: ./scripts/check_source_archive.ps1

      - name: Check canonical HostLink profile JSONs
        shell: pwsh
        run: ./scripts/update_hostlink_profile_jsons.ps1 -FailIfChanged

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Node-RED editor smoke runtime
        run: npm install --no-save --package-lock=false node-red@4.1.11

      - name: Verify tag and package version
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          actual_tag="$(git describe --tags --exact-match HEAD)"
          test "${actual_tag}" = "${EXPECTED_TAG}"
          actual_version="$(node -p 'require("./package.json").version')"
          test "${actual_version}" = "${EXPECTED_VERSION}"

      - name: Run tests
        run: node test/run-tests.js

      - name: Run editor smoke test
        env:
          NODE_RED_CMD: ${{ github.workspace }}/node_modules/node-red/red.js
        run: node test/run-editor-smoke.js

      - name: Pack npm package
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="fa_yoshinobu-node-red-contrib-plc-comm-kvhostlink-${EXPECTED_VERSION}.tgz"
          packed="$(npm pack --silent)"
          test "${packed}" = "${asset}"
          test -f "${asset}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${tag#v}"
          header="## [${version}]"
          asset="fa_yoshinobu-node-red-contrib-plc-comm-kvhostlink-${{ steps.version.outputs.version }}.tgz"
          test -f "${asset}"
          if ! changelog_notes="$(
            awk -v header="${header}" '
              index($0, header) == 1 { capture = 1 }
              capture && /^## \[/ && index($0, header) != 1 { exit }
              capture { print }
              END { if (!capture) exit 1 }
            ' CHANGELOG.md
          )"; then
            echo "::error::CHANGELOG.md is missing release section ${header}."
            exit 1
          fi
          test -n "${changelog_notes}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            current_body="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
            if ! grep -Fq -- "${header}" <<<"${current_body}"; then
              notes_file="${RUNNER_TEMP}/release-notes-${version}.md"
              printf '%s\n\n%s\n' "${changelog_notes}" "${current_body}" > "${notes_file}"
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --title "Release ${tag}" --notes-file "${notes_file}"
            fi
            gh release upload "${tag}" "${asset}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${asset}" --verify-tag --repo "${GITHUB_REPOSITORY}" --title "Release ${tag}" --notes "${changelog_notes}" --generate-notes --draft
          fi
