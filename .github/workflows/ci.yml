name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node-version:
          - 18
          - 20
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Check GitHub source archive contents
        shell: pwsh
        run: ./scripts/check_source_archive.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node test/run-tests.js

      - name: Validate package contents
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  windows-smoke:
    name: windows-latest / Node 20
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run tests
        shell: pwsh
        run: node test/run-tests.js

      - name: Validate package contents
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  editor-smoke:
    name: Editor smoke / Node-RED 4.1.11
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fixed Node-RED editor runtime
        env:
          NODE_RED_RUNTIME_DIR: ${{ runner.temp }}/node-red-editor-smoke-runtime
        run: npm install --prefix "$NODE_RED_RUNTIME_DIR" --no-save --package-lock=false node-red@4.1.11

      - name: Install package and round-trip the maintained example in Node-RED
        env:
          NODE_RED_CMD: ${{ runner.temp }}/node-red-editor-smoke-runtime/node_modules/node-red/red.js
        run: node test/run-editor-smoke.js
